<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>登录 - 9uu 账户中心</title>
  <meta name="description" content="登录 9uu 账户，体验高效便捷的企业数字化服务。">
  <link rel="stylesheet" href="../assets/css/amazeui.css" />
  <link rel="stylesheet" href="../assets/css/other.min.css" />
  <script src="../assets/js/tj.js"></script>
  <style>
    body.login-container {
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .login-box {
      background: #ffffff;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 380px;
      transition: transform 0.3s ease;
    }
    .login-box:hover {
      transform: translateY(-2px);
    }
    .logo-img {
      text-align: center;
      margin-bottom: 30px;
    }
    .logo-img img {
      max-height: 45px;
      width: auto;
    }
    .am-btn-secondary {
      background-color: #33b5e5;
      border-color: #33b5e5;
      width: 100%;
      border-radius: 4px;
      padding: 10px;
      font-size: 16px;
      transition: background-color 0.2s;
    }
    .am-btn-secondary:hover {
      background-color: #0099cc;
      border-color: #0088bb;
    }
    .am-form-group input {
      border-radius: 4px;
      padding-left: 35px;
    }
    .am-form-group {
      position: relative;
    }
    .am-form-group label {
      position: absolute;
      left: 10px;
      top: 10px;
      z-index: 2;
      color: #999;
    }
  </style>
</head>
<body class="login-container">
  <div class="login-box">
    <div class="logo-img">
      <img src="../assets/images/logo2_03.png" alt="9uu Logo" />
    </div>
    <form action="" class="am-form" data-am-validator>
      <div class="am-form-group">
        <label for="doc-vld-name-2"><i class="am-icon-user"></i></label>
        <input type="text" id="doc-vld-name-2" minlength="3" placeholder="输入 9uu 用户名（至少 3 个字符）" required/>
      </div>

      <div class="am-form-group">
        <label for="doc-vld-email-2"><i class="am-icon-key"></i></label>
        <input type="email" id="doc-vld-email-2" placeholder="输入绑定邮箱" required/>
      </div>
      <button class="am-btn am-btn-secondary" type="submit">登录 9uu</button>
    </form>
  </div>
</body>
</html>
